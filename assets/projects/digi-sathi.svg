<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="ds-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2B3D"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#ds-bg)"/>
  
  <!-- Left Side: Mobile Device Mockup -->
  <g transform="translate(40, 25)">
    <!-- Phone body -->
    <rect width="210" height="330" rx="28" fill="#11111B" stroke="#313244" stroke-width="3"/>
    <!-- Phone screen -->
    <rect x="10" y="10" width="190" height="310" rx="20" fill="url(#ds-phone)"/>
    <!-- Speaker notch -->
    <rect x="75" y="16" width="60" height="5" rx="2.5" fill="#45475A"/>
    
    <!-- Screen Header -->
    <text x="24" y="48" fill="#F5E0DC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">डिजी साथी (Digi Sathi)</text>
    <circle cx="176" cy="44" r="6" fill="#A6E3A1"/>
    
    <!-- Voice Help Pill -->
    <rect x="20" y="62" width="170" height="38" rx="12" fill="#313244"/>
    <circle cx="38" cy="81" r="10" fill="#F38BA8"/>
    <text x="34" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10">🎙</text>
    <text x="56" y="78" fill="#CDD6F4" font-family="system-ui, sans-serif" font-size="10" font-weight="600">बोलकर सीखें (Voice)</text>
    <text x="56" y="91" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="8">"UPI से पैसे कैसे भेजें?"</text>

    <!-- Interactive Simulated Lesson Tiles -->
    <rect x="20" y="110" width="80" height="74" rx="12" fill="#89B4FA" fill-opacity="0.15" stroke="#89B4FA" stroke-opacity="0.4"/>
    <text x="32" y="136" font-size="18">📲</text>
    <text x="30" y="160" fill="#89B4FA" font-family="system-ui, sans-serif" font-size="10" font-weight="700">UPI Pay</text>
    <text x="30" y="172" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="7">Simulated</text>

    <rect x="110" y="110" width="80" height="74" rx="12" fill="#A6E3A1" fill-opacity="0.15" stroke="#A6E3A1" stroke-opacity="0.4"/>
    <text x="122" y="136" font-size="18">💬</text>
    <text x="120" y="160" fill="#A6E3A1" font-family="system-ui, sans-serif" font-size="10" font-weight="700">WhatsApp</text>
    <text x="120" y="172" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="7">Safe Chat</text>

    <rect x="20" y="194" width="80" height="74" rx="12" fill="#FAB387" fill-opacity="0.15" stroke="#FAB387" stroke-opacity="0.4"/>
    <text x="32" y="220" font-size="18">🛡️</text>
    <text x="30" y="244" fill="#FAB387" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Scam Check</text>
    <text x="30" y="256" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="7">Fake SMS</text>

    <rect x="110" y="194" width="80" height="74" rx="12" fill="#F38BA8" fill-opacity="0.15" stroke="#F38BA8" stroke-opacity="0.4"/>
    <text x="122" y="220" font-size="18">🚨</text>
    <text x="120" y="244" fill="#F38BA8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SOS Alert</text>
    <text x="120" y="256" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="7">Emergency</text>

    <!-- Bottom Indicator -->
    <rect x="75" y="306" width="60" height="4" rx="2" fill="#585B70"/>
  </g>

  <!-- Right Side: Architecture & Inclusivity Highlights -->
  <g transform="translate(280, 45)">
    <rect width="280" height="42" rx="10" fill="#313244" stroke="#45475A"/>
    <text x="16" y="26" fill="#F9E2AF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⚡ Offline-First Architecture</text>
    <text x="210" y="26" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="10">PWA Ready</text>

    <!-- Feature Card 1 -->
    <rect y="58" width="280" height="72" rx="10" fill="#1E1E2E" stroke="#313244"/>
    <circle cx="28" cy="94" r="14" fill="#89B4FA" fill-opacity="0.2"/>
    <text x="22" y="99" fill="#89B4FA" font-size="14">🔊</text>
    <text x="52" y="86" fill="#CDD6F4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Multilingual Voice Navigation</text>
    <text x="52" y="104" fill="#9399B2" font-family="system-ui, sans-serif" font-size="10">Hindi, Marathi, English step-by-step narration</text>

    <!-- Feature Card 2 -->
    <rect y="142" width="280" height="72" rx="10" fill="#1E1E2E" stroke="#313244"/>
    <circle cx="28" cy="178" r="14" fill="#A6E3A1" fill-opacity="0.2"/>
    <text x="22" y="183" fill="#A6E3A1" font-size="14">🔒</text>
    <text x="52" y="170" fill="#CDD6F4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Zero-Risk Sandbox Simulations</text>
    <text x="52" y="188" fill="#9399B2" font-family="system-ui, sans-serif" font-size="10">Learn digital banking without real money risk</text>

    <!-- Feature Card 3 -->
    <rect y="226" width="280" height="72" rx="10" fill="#1E1E2E" stroke="#313244"/>
    <circle cx="28" cy="262" r="14" fill="#F9E2AF" fill-opacity="0.2"/>
    <text x="22" y="267" fill="#F9E2AF" font-size="14">📜</text>
    <text x="52" y="254" fill="#CDD6F4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Milestone Certificates & Progress</text>
    <text x="52" y="272" fill="#9399B2" font-family="system-ui, sans-serif" font-size="10">Empowering elders through verifiable mastery</text>
  </g>
</svg>
