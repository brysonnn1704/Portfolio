<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="rz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E28"/>
      <stop offset="100%" stop-color="#0D131A"/>
    </linearGradient>
    <linearGradient id="rz-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#253342" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#rz-bg)"/>
  <rect width="600" height="380" rx="16" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Header Bar -->
  <rect x="24" y="24" width="552" height="44" rx="8" fill="#1C2836"/>
  <circle cx="46" cy="46" r="6" fill="#EF4444"/>
  <circle cx="64" cy="46" r="6" fill="#F59E0B"/>
  <circle cx="82" cy="46" r="6" fill="#10B981"/>
  <text x="108" y="51" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RAKSHA-ZONE • NDRF SIH26191 GIS PLATFORM</text>
  <rect x="440" y="34" width="120" height="24" rx="12" fill="#EF4444" fill-opacity="0.2"/>
  <text x="454" y="50" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🔴 HIGH RISK ZONE</text>

  <!-- Left: Map Visualization -->
  <rect x="24" y="84" width="340" height="272" rx="12" fill="#182330" stroke="#2A3B4C"/>
  <!-- Topographic rings -->
  <circle cx="194" cy="220" r="110" fill="#EF4444" fill-opacity="0.05" stroke="#EF4444" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <circle cx="194" cy="220" r="75" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-opacity="0.4"/>
  <circle cx="194" cy="220" r="40" fill="#EF4444" fill-opacity="0.25" stroke="#EF4444"/>
  
  <!-- Waypoints & Relief Zones -->
  <circle cx="194" cy="220" r="8" fill="#EF4444"/>
  <circle cx="194" cy="220" r="18" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.8"/>
  <text x="160" y="200" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Wayanad Sector 4</text>
  
  <!-- Safe Haven Point -->
  <circle cx="90" cy="140" r="7" fill="#10B981"/>
  <text x="105" y="144" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Shelter A (Cap: 450)</text>
  <line x1="194" y1="220" x2="90" y2="140" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Safe Haven Point 2 -->
  <circle cx="290" cy="130" r="7" fill="#10B981"/>
  <text x="210" y="115" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Relocation Base B</text>
  <line x1="194" y1="220" x2="290" y2="130" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Right: Telemetry & Resource Stats -->
  <rect x="380" y="84" width="196" height="82" rx="10" fill="#1C2836" stroke="#2A3B4C"/>
  <text x="396" y="108" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Safe Carrying Capacity</text>
  <text x="396" y="136" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">89.4%</text>
  <rect x="396" y="146" width="164" height="6" rx="3" fill="#253342"/>
  <rect x="396" y="146" width="146" height="6" rx="3" fill="#38BDF8"/>

  <rect x="380" y="178" width="196" height="82" rx="10" fill="#1C2836" stroke="#2A3B4C"/>
  <text x="396" y="202" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Active Lifeline Supplies</text>
  <text x="396" y="230" fill="#10B981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">12,450</text>
  <text x="396" y="248" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Rations • Medical • Clean Water</text>

  <rect x="380" y="272" width="196" height="84" rx="10" fill="#1C2836" stroke="#2A3B4C"/>
  <text x="396" y="296" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Smart Route Matching</text>
  <text x="396" y="322" fill="#FEA831" font-family="system-ui, sans-serif" font-size="18" font-weight="700">3 Optimal Paths</text>
  <text x="396" y="342" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">NDRF Decision Engine</text>
</svg>
