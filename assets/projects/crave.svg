<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181313"/>
      <stop offset="100%" stop-color="#0E0B0B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#cr-bg)"/>
  
  <!-- Header -->
  <rect x="24" y="24" width="552" height="46" rx="12" fill="#261C1C" stroke="#3D2929"/>
  <circle cx="48" cy="47" r="12" fill="#E11D48"/>
  <text x="44" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="900">C</text>
  <text x="68" y="52" fill="#FFF1F2" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Crave</text>
  <rect x="120" y="37" width="160" height="20" rx="10" fill="#E11D48" fill-opacity="0.15"/>
  <text x="130" y="51" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">📍 Bandra West, Mumbai</text>
  
  <rect x="440" y="36" width="120" height="22" rx="11" fill="#E11D48" fill-opacity="0.2"/>
  <text x="452" y="51" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="10" font-weight="700">75 OSM Venues</text>

  <!-- Left: Food Discovery Cards -->
  <g transform="translate(24, 86)">
    <!-- Food Card 1 -->
    <rect width="268" height="126" rx="12" fill="#241B1B" stroke="#3B2828"/>
    <rect x="12" y="12" width="64" height="64" rx="8" fill="#4C1D24"/>
    <text x="28" y="50" font-size="28">🍛</text>
    <text x="88" y="32" fill="#FFF1F2" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Spice Symphony</text>
    <text x="88" y="48" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="10">North Indian • Biryani • Mughlai</text>
    <rect x="88" y="56" width="46" height="18" rx="4" fill="#10B981"/>
    <text x="94" y="69" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">★ 4.6</text>
    <text x="142" y="69" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">25-30 mins</text>
    <line x1="12" y1="88" x2="256" y2="88" stroke="#382424" stroke-width="1"/>
    <text x="16" y="108" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="10" font-weight="600">50% OFF up to ₹100 • Use CRAVE50</text>

    <!-- Food Card 2 -->
    <g transform="translate(0, 138)">
      <rect width="268" height="126" rx="12" fill="#241B1B" stroke="#3B2828"/>
      <rect x="12" y="12" width="64" height="64" rx="8" fill="#3B2117"/>
      <text x="28" y="50" font-size="28">🍕</text>
      <text x="88" y="32" fill="#FFF1F2" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Artisan Woodfired</text>
      <text x="88" y="48" fill="#FDBA74" font-family="system-ui, sans-serif" font-size="10">Italian • Sourdough • Pastas</text>
      <rect x="88" y="56" width="46" height="18" rx="4" fill="#10B981"/>
      <text x="94" y="69" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">★ 4.8</text>
      <text x="142" y="69" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">35-40 mins</text>
      <line x1="12" y1="88" x2="256" y2="88" stroke="#382424" stroke-width="1"/>
      <text x="16" y="108" fill="#FB923C" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Free Garlic Bread on orders > ₹399</text>
    </g>
  </g>

  <!-- Right: OSM Map & Live Tracking -->
  <g transform="translate(308, 86)">
    <rect width="268" height="264" rx="12" fill="#241B1B" stroke="#3B2828"/>
    <!-- Simulated map pattern -->
    <rect x="12" y="12" width="244" height="150" rx="8" fill="#1C1515"/>
    <path d="M 12 60 Q 120 40 256 90 M 120 12 L 140 162 M 60 162 L 200 12" stroke="#3D2929" stroke-width="3" fill="none"/>
    <circle cx="90" cy="70" r="10" fill="#E11D48" fill-opacity="0.3"/>
    <circle cx="90" cy="70" r="5" fill="#E11D48"/>
    <circle cx="180" cy="110" r="10" fill="#10B981" fill-opacity="0.3"/>
    <circle cx="180" cy="110" r="5" fill="#10B981"/>
    <path d="M 90 70 Q 140 60 180 110" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    
    <!-- Delivery Tracker Pill -->
    <rect x="24" y="120" width="220" height="32" rx="16" fill="#181313" stroke="#4C1D24"/>
    <circle cx="40" cy="136" r="6" fill="#10B981"/>
    <text x="54" y="140" fill="#FFF1F2" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Order Out for Delivery</text>
    <text x="194" y="140" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">12 min</text>

    <!-- Bottom summary -->
    <text x="18" y="188" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">OpenStreetMap Overpass Engine</text>
    <text x="18" y="206" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">GeoJSON coordinates & 444 authentic menu items</text>
    
    <rect x="18" y="222" width="232" height="30" rx="6" fill="#E11D48"/>
    <text x="74" y="242" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Explore Crave Live ↗</text>
  </g>
